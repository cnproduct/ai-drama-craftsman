<body>

  <div class="layout">

    </div>

    <div class="sidebar">
      <div class="sidebar-header">
        <span>分镜播放列表 (全剧集)</span>
        <span style="font-size: 12px; color: var(--text-muted);">点击即播</span>

  </div>

  <script>
    const videos = [

    "prompt": "小婉纤指采嫩芽微张嘴甜笑，铁柱熊掌大抓老树枝咧嘴狂笑自夸，对比鲜明"

    "prompt": "【零字幕口型重拍版】阿福双手握断树枝痛心疾首大张嘴大喊，铁柱憨笑，每一帧纯净无字！"
  },
  {

    "url": "https://libtv-res.liblib.art/sd-gen-save-img/genius_playground/video/a2a811940e5f41c6a345b53b080aa78b/c6251632f10ee9be6ba44238deeddd87f29d5bdd74ad29238a701681520edec5.mp4",
    "prompt": "一鸣巨石上帅气自拍对手机飞速说辞，断网瞬间面容僵死抱头大张嘴仰天咆哮"

    "duration": "9.08s",

    "duration": "9.08s",
    "url": "https://libtv-res.liblib.art/sd-gen-save-img/genius_playground/video/a2a811940e5f41c6a345b53b080aa78b/a12fa8ffc02bf76da591a08785ea8bc153bed57feeb9bcd669cf2655d194e778.mp4",
    "prompt": "铁柱抡生锈大斧慢动作劈柴震塌烟囱泥块，中原抱锅大张嘴惊恐跳脚"

    "prompt": "【烟雾连续性与同画幅重拍版】注入连续介质气溶胶扩散协议，黄烟自铁锅持续产出单调扩散，彻底消除06s消散、08s突兀闪现的断裂感；同画幅中景运镜，零字幕纯净底片！"
  },
  {
    "id": "v-a2wxGTbACs",
    "title": "SC8: 四人集体花脸眼泪汪汪",
    "duration": "9.08s",
    "url": "https://libtv-res.liblib.art/sd-gen-save-img/genius_playground/video/a2a811940e5f41c6a345b53b080aa78b/c4569e741bb504e001ddb7baebfcc1ffd9cf0d4a68f39e0df9366a91fe155a9c.mp4",
    "prompt": "四人花脸蹲泥墙根，铁柱伸出大舌头大口喘气扇风，小婉拭泪轻声诉委屈"
  },
  {
    "id": "v-ZQyeTpE7qf",
    "title": "SC9: 阿福神茶降临与商业反转",
    "duration": "9.09s",
    "url": "https://libtv-res.liblib.art/sd-gen-save-img/genius_playground/video/a2a811940e5f41c6a345b53b080aa78b/629b8f7165c66604730ecce29cfe19816b3f6c4864ff68bfa2b238371cc16f82.mp4",
    "prompt": "【流体力学与结构合理重拍版】严格将琥珀茶水水位约束在竹筒侧面饮用缺口/溢流口最低凹缘以下 2~3cm，彻底解决液面反重力悬浮bug；阿福大张嘴生动推销，零字幕纯净底片！"
  },
  {
    "id": "v-eKUUXoQlho",
    "title": "SC10: 哄抢神茶与小院爆笑定格",
    "duration": "9.08s",
    "url": "https://libtv-res.liblib.art/sd-gen-save-img/genius_playground/video/a2a811940e5f41c6a345b53b080aa78b/92ce9e29ac4937d54340d3602a6df36ad4798f855ec111681d41a934572c229a.mp4",
    "prompt": "【人体生物力学与物理重拍版】强化地面反作用力与足底压实蹬地，第3秒跌倒严格遵循人体保护缓冲反射（双臂撑地+向前滑行缓冲+沙土爆散），彻底根除失重与爬行动作！"
  }
];
    let currentIndex = 0;
    let autoNext = true;

    const mainVideo = document.getElementById('mainVideo');
    const playlistEl = document.getElementById('playlist');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const loopBtn = document.getElementById('loopBtn');
    const currDownload = document.getElementById('currDownload');

    function renderList() {
      playlistEl.innerHTML = '';
      videos.forEach((v, idx) => {
        const item = document.createElement('div');
        item.className = 'shot-card' + (idx === currentIndex ? ' active' : '');
        item.innerHTML = `
          <div class="shot-info">
            <h4>${idx + 1}. ${v.title}</h4>
            <p>时长: ${v.duration || '9s'} · 节点: ${v.id}</p>
          </div>
          <a href="${v.url}" target="_blank" download class="download-pill" onclick="event.stopPropagation()">下载直链</a>
        `;
        item.onclick = () => playIndex(idx);
        playlistEl.appendChild(item);
      });
    }

    function playIndex(index) {
      if (index < 0 || index >= videos.length) return;
      currentIndex = index;
      const target = videos[currentIndex];
      mainVideo.src = target.url;
      currDownload.href = target.url;
      currDownload.setAttribute('download', (target.title || 'shot') + '.mp4');
      mainVideo.play().catch(e => console.log('Autoplay prevented:', e));
      renderList();
    }

    mainVideo.onended = () => {
      if (autoNext) {
        if (currentIndex < videos.length - 1) {
          playIndex(currentIndex + 1);
        } else {
          playIndex(0); // 循环回到第一个
        }
      }
    };

    prevBtn.onclick = () => playIndex(Math.max(0, currentIndex - 1));
    nextBtn.onclick = () => playIndex((currentIndex + 1) % videos.length);
    loopBtn.onclick = () => {
      autoNext = !autoNext;
      loopBtn.textContent = autoNext ? '🔁 连续自动播: 开' : '⏹ 连续自动播: 关';
      loopBtn.classList.toggle('active', autoNext);
    };

    document.querySelectorAll('.speedBtn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.speedBtn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mainVideo.playbackRate = parseFloat(btn.dataset.speed);
      };
    });

    renderList();
    if (videos.length > 0) playIndex(0);
  </script>
</body>
</html>
