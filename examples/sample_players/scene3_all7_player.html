];
    let currentIndex = 0;
    let autoNext = true;

    const mainVideo = document.getElementById('mainVideo');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const loopBtn = document.getElementById('loopBtn');
    const playingIndex = document.getElementById('playingIndex');
    const itemsContainer = document.getElementById('itemsContainer');

    function renderList() {
      itemsContainer.innerHTML = '';
      videos.forEach((v, idx) => {
        const card = document.createElement('div');
        card.className = 'item-card' + (idx === currentIndex ? ' active' : '');
        card.onclick = () => switchVideo(idx);

        card.innerHTML = `
          <div class="item-num">${v.section}</div>
          <div class="item-info">
            <div class="item-name">${v.title}</div>
            <div class="item-desc">${v.desc}</div>
            <div class="item-tags">
              <span class="tag tag-sec">${v.durationSec}s</span>
              <span class="tag">${v.resolution}</span>
              <span class="tag tag-pure">${v.id}</span>
              <a href="${v.url}" target="_blank" onclick="event.stopPropagation()" style="color:#38bdf8; text-decoration:none; margin-left:auto; font-size:11px;">下载/直链 ↗</a>
            </div>
          </div>
        `;
        itemsContainer.appendChild(card);
      });
      playingIndex.textContent = `正在播放 第 ${currentIndex + 1} / ${videos.length} 节`;
    }

    function switchVideo(idx) {
      if (idx < 0) idx = 0;
      if (idx >= videos.length) idx = videos.length - 1;
      currentIndex = idx;
      mainVideo.src = videos[currentIndex].url;
      mainVideo.play().catch(e => console.log('Autoplay prevented:', e));
      renderList();
    }

    mainVideo.onended = () => {
      if (autoNext) {
        if (currentIndex < videos.length - 1) {
          switchVideo(currentIndex + 1);
        } else {
          switchVideo(0);
        }
      }
    };

    prevBtn.onclick = () => switchVideo(currentIndex - 1);
    nextBtn.onclick = () => switchVideo(currentIndex + 1);
    loopBtn.onclick = () => {
      autoNext = !autoNext;
      loopBtn.textContent = `连续播放: ${autoNext ? '开' : '关'}`;
      loopBtn.style.background = autoNext ? '#7c3aed' : '#475569';
    };

    // 初始化播放
    switchVideo(0);
  </script>
